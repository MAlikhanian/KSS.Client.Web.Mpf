---
# ⚠ `nextauth-secret` IS NOT IN THIS FILE, AND MUST NOT BE ADDED TO IT.
#
# Two reasons, both load-bearing:
#   1. An empty value here would let the pod START and then 500 every data
#      route while probes keep reporting Ready. Absent + non-optional gives
#      CreateContainerConfigError instead — the pod never starts. See the
#      NEXTAUTH_SECRET note in the Deployment above.
#   2. `kubectl apply -f deployment.yaml` would re-blank a hand-patched value
#      on every subsequent apply, silently, long after anyone remembers why.
#
# Create it out-of-band — docker-k8s-command.txt step 6 copies it from the
# Shell's secret directly, which is the only correct source.
#
# The storage keys below ARE checked in as empty because their references are
# marked `optional: true`: absent or empty, the pod starts either way, and this
# app has no upload path today. They are read by lib/s3-client.ts and
# lib/s3-upload.ts, which no current route reaches.
#
# To set a single value:
#   kubectl patch secret kss-client-web-mpf-secrets -n kss-client-web-mpf \
#     -p "{\"data\":{\"KEY\":\"$(echo -n 'VALUE' | base64 -w0)\"}}"
apiVersion: v1
kind: Secret
metadata:
  name: kss-client-web-mpf-secrets
  namespace: kss-client-web-mpf
type: Opaque
data:
  storage-endpoint: "<STORAGE_ENDPOINT_BASE64>"
  storage-region: "<STORAGE_REGION_BASE64>"
  storage-bucket: "<STORAGE_BUCKET_BASE64>"
  storage-access-key-id: "<STORAGE_ACCESS_KEY_ID_BASE64>"
  storage-secret-access-key: "<STORAGE_SECRET_ACCESS_KEY_BASE64>"
  storage-cdn-url: "<STORAGE_CDN_URL_BASE64>"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kss-client-web-mpf-pdb
  namespace: kss-client-web-mpf
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kss-client-web-mpf
---
# Only the Shell may reach this zone. There is no Ingress, so this is belt and
# braces — but it is the control that makes "no public entrypoint" a property
# of the cluster rather than of a file nobody re-reads.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kss-client-web-mpf-network-policy
  namespace: kss-client-web-mpf
spec:
  podSelector:
    matchLabels:
      app: kss-client-web-mpf
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kss-client-web
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - { protocol: TCP, port: 80 }
    - { protocol: TCP, port: 443 }
    - { protocol: TCP, port: 8000 }
